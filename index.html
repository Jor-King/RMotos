<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>RMotos · Repuestos y accesorios para motos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="https://res.cloudinary.com/dzw0j83fi/image/upload/v1780002163/Rmotos_logo_ws3eyt.png" />
</head>

<body>

  <header class="header">
    <div class="header__logo">
      <a href="https://R-MOTOS.github.io/RMotos/">
      <img src="https://res.cloudinary.com/dzw0j83fi/image/upload/v1780002163/Rmotos_logo_ws3eyt.png" alt="R-MOTOS">
      </a>
    </div>
    <button class="cart-button" id="cart-button" aria-label="Ver carrito">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1" />
        <circle cx="20" cy="21" r="1" />
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
      </svg>
      <span class="cart-badge is-hidden" id="cart-badge">0</span>
    </button>
  </header>

  <section class="search-section">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.35-4.35" />
      </svg>
      <input id="search-input" type="text" placeholder="Buscar por nombre, código, marca o compatibilidad...">
    </div>
  </section>

  <nav class="category-bar" id="category-bar" aria-label="Categorías"></nav>

  <div class="filters-bar" style="display: none">
    <select id="filter-type" >
      <option value="">Todos los tipos</option>
      <option value="original">Original</option>
      <option value="generico">Genérico</option>
      <option value="premium">Premium</option>
    </select>
    <label class="filter-checkbox">
      <input type="checkbox" id="filter-available">
      Solo disponibles
    </label>
  </div>

  <p class="results-count" id="results-count"></p>

  <main class="product-grid" id="product-grid"></main>

  <div class="pagination" id="pagination">
    <p class="pagination-info" id="pagination-info"></p>
    <div class="pagination-buttons" id="pagination-buttons"></div>
  </div>

  <!-- Carrito -->
  <div class="cart-overlay" id="cart-overlay"></div>
  <aside class="cart-panel" id="cart-panel" aria-label="Carrito de compras">
    <div class="cart-panel__header">
      <h2 class="cart-panel__title">Tu carrito</h2>
      <button class="cart-panel__close" id="cart-close" aria-label="Cerrar carrito">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <div class="cart-panel__items" id="cart-items"></div>
    <div class="cart-panel__footer">
      <div class="cart-total-row">
        <span>Total</span>
        <span id="cart-total">$0</span>
      </div>

      <div class="cart-info">
        <span>💬</span>
        <p>
          Tu pedido será enviado por WhatsApp a uno de nuestros asesores, quien te ayudará con disponibilidad, entrega y
          métodos de pago.
        </p>
      </div>

      <button class="btn btn--checkout" id="cart-checkout" disabled>
        Confirmar pedido
      </button>

      <button class="btn--clear" id="cart-clear">
        Vaciar carrito
      </button>
    </div>
  </aside>

  <!-- Botón flotante de WhatsApp -->
  <div class="whatsapp-float">
    <div class="whatsapp-bubble" id="whatsapp-message"></div>
    <a class="whatsapp-fab" href="#" onclick="window.open('https://wa.me/573007162353','_blank'); return false;"
      aria-label="Escríbenos por WhatsApp">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="white">
        <path
          d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.38 5.07L2 22l5.05-1.32A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm5.2 14.15c-.22.62-1.28 1.18-1.77 1.24-.45.06-1.02.09-1.65-.1-.38-.12-.87-.28-1.5-.55-2.63-1.14-4.34-3.8-4.47-3.98-.13-.18-1.07-1.42-1.07-2.72 0-1.3.68-1.93.92-2.2.24-.27.53-.33.7-.33h.5c.16 0 .38-.06.6.45.22.53.75 1.83.82 1.96.07.13.11.29.02.47-.09.18-.13.29-.26.44-.13.15-.27.34-.39.46-.13.13-.26.27-.11.53.15.27.68 1.12 1.46 1.81 1 .89 1.85 1.17 2.11 1.3.27.13.42.11.58-.07.16-.18.66-.77.84-1.03.18-.27.35-.22.6-.13.24.09 1.53.72 1.79.85.27.13.44.2.51.31.06.11.06.65-.16 1.28z" />
      </svg>
    </a>
  </div>

  <!-- Modal para ver la imagen del producto en grande -->
  <div class="image-modal" id="image-modal">
    <button class="image-modal__close" id="image-modal-close" aria-label="Cerrar imagen">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <img class="image-modal__img" id="image-modal-img" src="" alt="">
  </div>

  <script src="utils.js"></script>
  <script src="api.js"></script>
  <script src="components.js"></script>
  <script src="filters.js"></script>
  <script src="cart.js"></script>
  <script src="app.js"></script>
  <script>
    // Drag-to-scroll de la barra de categorías
    (function () {
      const bar = document.getElementById('category-bar');
      let isDown = false, startX, scrollLeft;
      bar.addEventListener('mousedown', (e) => {
        isDown = true;
        bar.classList.add('is-dragging');
        startX = e.pageX - bar.offsetLeft;
        scrollLeft = bar.scrollLeft;
      });
      ['mouseleave', 'mouseup'].forEach((evt) =>
        bar.addEventListener(evt, () => { isDown = false; bar.classList.remove('is-dragging'); })
      );
      bar.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - bar.offsetLeft;
        bar.scrollLeft = scrollLeft - (x - startX) * 1.5;
      });
    })();
  </script>
</body>

</html>
